name: Publication

on:
  push:
    branches: [main]
    paths:
      - "src/content/essays/**"
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Orchestrate publication
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
          SITE_URL: ${{ vars.NEWSLETTER_SITE_URL || 'https://buthonestly.io' }}
        run: npm run publication

      - name: Record publication state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publication-state.json
          if git diff --staged --quiet; then
            echo "Publication state unchanged."
          else
            git commit -m "chore: record publication state [skip ci]"
            git pull --rebase origin main
            git push
          fi
