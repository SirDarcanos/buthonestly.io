name: Prepare semantic related essays

# Regenerates the semantic related-essay map and commits it, which triggers a
# Pages rebuild. The model (onnxruntime-node, ~200MB) is installed ad-hoc so it
# never touches the Cloudflare deploy install.

on:
  push:
    branches: [main]
    paths:
      - "src/content/essays/**"
      - "scripts/build-related.mjs"
      - "src/lib/related-essays.mjs"
  workflow_dispatch:

concurrency:
  group: related
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  related:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm install --no-save @huggingface/transformers@4.2.0

      - run: npm run related

      - name: Commit refreshed map
        env:
          REPOSITORY_DEPLOY_KEY: ${{ secrets.REPOSITORY_DEPLOY_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/embeddings.json data/related.json
          if git diff --staged --quiet; then
            echo "Related map unchanged."
          else
            KEY_PATH="$RUNNER_TEMP/repository-deploy-key"
            umask 077
            printf '%s\n' "$REPOSITORY_DEPLOY_KEY" > "$KEY_PATH"
            trap 'rm -f "$KEY_PATH"' EXIT
            export GIT_SSH_COMMAND="ssh -i $KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
            git commit -m "chore: rebuild related essays"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
            done
            exit 1
          fi
