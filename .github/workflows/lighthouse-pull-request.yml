name: Lighthouse pull-request monitoring

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pull-request base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .lighthouse-base
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .lighthouse-base/package-lock.json

      - name: Install head revision dependencies
        run: npm ci

      - name: Plan pull-request routes
        id: pull_request_plan
        env:
          LIGHTHOUSE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/plan-lighthouse-pull-request.mjs

      - name: Install base revision dependencies
        if: steps.pull_request_plan.outputs.selected == 'true'
        working-directory: .lighthouse-base
        run: npm ci

      - name: Restore shared Astro image assets
        id: image_cache
        if: steps.pull_request_plan.outputs.selected == 'true'
        uses: actions/cache@v5
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-${{ runner.arch }}-astro-assets-v1-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-astro-assets-v1-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-

      - name: Build head revision
        if: steps.pull_request_plan.outputs.selected == 'true'
        env:
          LIGHTHOUSE_PREVIEW_SLUGS: ${{ steps.pull_request_plan.outputs.preview_slugs }}
        run: npm run build

      - name: Share head image assets with base
        if: steps.pull_request_plan.outputs.selected == 'true'
        run: node scripts/share-lighthouse-images.mjs . .lighthouse-base

      - name: Build base revision
        if: steps.pull_request_plan.outputs.selected == 'true'
        working-directory: .lighthouse-base
        env:
          LIGHTHOUSE_PREVIEW_SLUGS: ${{ steps.pull_request_plan.outputs.preview_slugs }}
        run: |
          if grep -q LIGHTHOUSE_PREVIEW_SLUGS src/lib/essays.ts; then
            npm run build
          else
            LIGHTHOUSE_INCLUDE_SCHEDULED=true npm run build
          fi

      - name: Retain base image assets for future runs
        if: steps.pull_request_plan.outputs.selected == 'true'
        run: node scripts/share-lighthouse-images.mjs .lighthouse-base .

      - name: Start revision servers
        if: steps.pull_request_plan.outputs.selected == 'true'
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/lighthouse-head.log" 2>&1 &)
          (cd .lighthouse-base && npm run preview -- --host 127.0.0.1 --port 4322 > "$RUNNER_TEMP/lighthouse-base.log" 2>&1 &)
          for url in http://127.0.0.1:4321 http://127.0.0.1:4322; do
            for attempt in {1..30}; do curl --fail --silent "$url" >/dev/null && break; sleep 1; done
            curl --fail --silent "$url" >/dev/null
          done

      - name: Audit pull request on one runner
        if: steps.pull_request_plan.outputs.selected == 'true'
        env:
          LIGHTHOUSE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LIGHTHOUSE_BASE_URL: http://127.0.0.1:4322
          LIGHTHOUSE_HEAD_URL: http://127.0.0.1:4321
          LIGHTHOUSE_ARTIFACT_DIR: artifacts/lighthouse
          LIGHTHOUSE_PULL_REQUEST_ROUTES: ${{ steps.pull_request_plan.outputs.routes }}
        run: npm run lighthouse -- --trigger pull-request

      - name: Report image cache outcome
        if: always() && steps.pull_request_plan.outputs.selected == 'true'
        env:
          IMAGE_CACHE_HIT: ${{ steps.image_cache.outputs.cache-hit }}
        run: |
          printf '\n## Lighthouse build reuse\n\nImage assets exact cache hit: `%s` (false or empty means prefix restore or miss; see restore logs). Both revisions are configured to rebuild; no page or measurement reuse. Phase timings are in the job steps.\n' "$IMAGE_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}
          path: artifacts/lighthouse
          if-no-files-found: ignore
          retention-days: 90
