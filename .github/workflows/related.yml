name: Prepare semantic related essays

# Regenerates the semantic related-essay map and commits it, which triggers a
# Pages rebuild. The model (onnxruntime-node, ~200MB) is installed ad-hoc so it
# never touches the Cloudflare deploy install.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/related.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-related.mjs"
      - "src/content/essays/**"
      - "src/lib/essay-inventory.mjs"
      - "src/lib/related-essays.mjs"
  workflow_dispatch:

concurrency:
  group: related
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  related:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm install --no-save @huggingface/transformers@4.2.0

      - run: npm run related

      - name: Commit refreshed map
        env:
          REPOSITORY_DEPLOY_KEY: ${{ secrets.REPOSITORY_DEPLOY_KEY }}
        run: node scripts/checkpoint-generated-state.mjs related
