name: Publication

on:
  push:
    branches: [main]
    paths:
      - "src/content/essays/**"
  schedule:
    - cron: "5 * * * *"
    - cron: "15 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare publication actions
        id: publication_prepare
        continue-on-error: true
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
          SITE_URL: ${{ vars.NEWSLETTER_SITE_URL || 'https://buthonestly.io' }}
          PUBLICATION_MONITORING_HANDOFF_FILE: artifacts/publication-monitoring-handoff.json
        run: npm run publication

      - name: Record draft identities and partial successes
        id: publication_checkpoint
        if: always()
        env:
          REPOSITORY_DEPLOY_KEY: ${{ secrets.REPOSITORY_DEPLOY_KEY }}
        run: node scripts/checkpoint-generated-state.mjs publication

      - name: Resume recorded Kit broadcasts
        id: publication_resume
        if: ${{ always() && steps.publication_checkpoint.outcome == 'success' }}
        continue-on-error: true
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
          SITE_URL: ${{ vars.NEWSLETTER_SITE_URL || 'https://buthonestly.io' }}
          PUBLICATION_MONITORING_HANDOFF_FILE: artifacts/publication-monitoring-handoff.json
        run: npm run publication

      - name: Record delivery and remaining partial successes
        id: publication_final_checkpoint
        if: always()
        env:
          REPOSITORY_DEPLOY_KEY: ${{ secrets.REPOSITORY_DEPLOY_KEY }}
        run: node scripts/checkpoint-generated-state.mjs publication

      - name: Hand Live Essays to monitoring
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: publication-monitoring-handoff
          path: artifacts/publication-monitoring-handoff.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Report provider failures
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.publication_prepare.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.publication_checkpoint.outcome }}
          RESUME_OUTCOME: ${{ steps.publication_resume.outcome }}
          FINAL_CHECKPOINT_OUTCOME: ${{ steps.publication_final_checkpoint.outcome }}
        run: |
          if [[ "$PREPARE_OUTCOME" == "failure" || "$CHECKPOINT_OUTCOME" == "failure" || "$RESUME_OUTCOME" == "failure" || "$FINAL_CHECKPOINT_OUTCOME" == "failure" ]]; then
            exit 1
          fi
