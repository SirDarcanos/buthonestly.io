name: Prepare semantic related essays

# Regenerates the semantic related-essay map and commits it, which triggers a
# Pages rebuild. The model (onnxruntime-node, ~200MB) is installed ad-hoc so it
# never touches the Cloudflare deploy install.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/related.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-related.mjs"
      - "src/content/essays/**"
      - "src/lib/essay-inventory.mjs"
      - "src/lib/related-essays.mjs"
  workflow_dispatch:

concurrency:
  group: related
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  related:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: 1password/install-cli-action@v4
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - name: Install the workflow-only embedding runtime
        run: |
          manifest=$(mktemp)
          cp package.json "$manifest"
          trap 'cp "$manifest" package.json; rm -f "$manifest"' EXIT
          pnpm add --lockfile=false @huggingface/transformers@4.2.0

      - run: pnpm run related

      - name: Commit refreshed map
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op run --environment "${{ vars.OP_ENVIRONMENT_ID }}" -- env -u OP_SERVICE_ACCOUNT_TOKEN node scripts/checkpoint-generated-state.mjs related
