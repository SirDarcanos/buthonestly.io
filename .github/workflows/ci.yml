name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore trusted main image assets
        id: image_cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-${{ runner.arch }}-astro-assets-v2-node24-main-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-astro-assets-v2-node24-main-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-

      - name: Test failure detection
        run: npm test

      - name: Verify code and configuration formatting
        run: npm run format:check

      - name: Verify content correctness
        run: npm run check:links

      - name: Build production site
        run: npm run build

      - name: Save trusted main image assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules/.astro/assets
          key: ${{ steps.image_cache.outputs.cache-primary-key }}
