name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test failure detection
        run: npm test

      - name: Verify code and configuration formatting
        run: npm run format:check

      - name: Verify content correctness
        run: npm run check:links

      - name: Build production site
        run: npm run build
