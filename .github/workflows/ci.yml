name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Identify image toolchain
        id: image_toolchain
        run: node scripts/image-cache-key.mjs .

      - name: Restore trusted main image assets
        id: image_cache
        if: steps.image_toolchain.outputs.key != ''
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-${{ runner.arch }}-astro-assets-v3-main-${{ steps.image_toolchain.outputs.key }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-astro-assets-v3-main-${{ steps.image_toolchain.outputs.key }}-

      - name: Test failure detection
        run: pnpm test

      - name: Verify code and configuration formatting
        run: pnpm run format:check

      - name: Verify content correctness
        run: pnpm run check:links

      - name: Build production site
        run: pnpm run build

      - name: Save trusted main image assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image_toolchain.outputs.key != '' && steps.image_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules/.astro/assets
          key: ${{ steps.image_cache.outputs.cache-primary-key }}
